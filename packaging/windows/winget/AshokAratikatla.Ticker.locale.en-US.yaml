ShortDescription: Local-first health data logger for heart rate and HRV.
Description: |-
  Ticker records heart rate and beat-to-beat intervals from any standard
  Bluetooth chest strap or broadcasting watch, derives HRV, and stores
  everything in one local SQLite file. It can also pull sleep, SpO2 and
  activity from vendor APIs. Nothing leaves the machine unless you send it
  somewhere yourself.
