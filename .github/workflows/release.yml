name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (for example v1.0.0)"
        required: true

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - id: release
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.]+)?$ ]]
          git show-ref --verify --quiet "refs/tags/$TAG"
          COMMIT="$(git rev-parse "refs/tags/$TAG^{commit}")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
          - os: macos-14
            platform: macos
          - os: ubuntu-22.04
            platform: linux
    runs-on: ${{ matrix.os }}
    env:
      TICKER_VERSION: ${{ needs.resolve.outputs.version }}
      RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
      SIGN_RELEASES: ${{ vars.SIGN_RELEASES == 'true' }}
      WINDOWS_SIGNING_AVAILABLE: ${{ secrets.AZURE_CLIENT_ID != '' }}
      MACOS_SIGNING_AVAILABLE: ${{ secrets.MACOS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve.outputs.commit }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.12"
      - name: Require configured signing when policy demands it
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SIGN_RELEASES" == "true" && "${{ matrix.platform }}" == "windows" && "$WINDOWS_SIGNING_AVAILABLE" != "true" ]]; then
            echo "SIGN_RELEASES requires Azure Trusted Signing credentials" >&2; exit 1
          fi
          if [[ "$SIGN_RELEASES" == "true" && "${{ matrix.platform }}" == "macos" && "$MACOS_SIGNING_AVAILABLE" != "true" ]]; then
            echo "SIGN_RELEASES requires Apple signing credentials" >&2; exit 1
          fi
      - name: Build, test, and smoke-test the packaged app
        run: python build.py --version "${{ needs.resolve.outputs.version }}" --commit "${{ needs.resolve.outputs.commit }}"

      - name: Azure login for Trusted Signing
        if: matrix.platform == 'windows' && env.WINDOWS_SIGNING_AVAILABLE == 'true'
        uses: azure/login@eec3c95657c1536435858eda1f3ff5437fee8474 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign every Windows binary
        if: matrix.platform == 'windows' && env.WINDOWS_SIGNING_AVAILABLE == 'true'
        uses: azure/trusted-signing-action@0d74250c661747df006298d0fb49944c10f16e03 # v0.5.1
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: dist/Ticker
          files-folder-filter: exe,dll,pyd
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Install Inno Setup
        if: matrix.platform == 'windows'
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build installer from the signed bundle
        if: matrix.platform == 'windows'
        run: python build.py --installer-only --version "${{ needs.resolve.outputs.version }}"
      - name: Sign Windows installer
        if: matrix.platform == 'windows' && env.WINDOWS_SIGNING_AVAILABLE == 'true'
        uses: azure/trusted-signing-action@0d74250c661747df006298d0fb49944c10f16e03 # v0.5.1
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Create Windows archive and winget manifests
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Ticker -DestinationPath dist/Ticker.zip
          python build.py --winget-only --version "$env:TICKER_VERSION"

      - name: Import macOS Developer ID certificate
        if: matrix.platform == 'macos' && env.MACOS_SIGNING_AVAILABLE == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$MACOS_CERTIFICATE" | base64 --decode > /tmp/certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import /tmp/certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f /tmp/certificate.p12
      - name: Sign, notarize, and staple macOS app
        if: matrix.platform == 'macos' && env.MACOS_SIGNING_AVAILABLE == 'true'
        env:
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.MACOS_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.MACOS_APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          set -euo pipefail
          find dist/Ticker.app -type f \( -name "*.dylib" -o -name "*.so" \) -exec codesign --force --timestamp --options runtime --sign "$IDENTITY" {} +
          codesign --force --timestamp --options runtime --entitlements packaging/macos/entitlements.plist --sign "$IDENTITY" dist/Ticker.app
          codesign --verify --strict --verbose=2 dist/Ticker.app
          ditto -c -k --keepParent dist/Ticker.app /tmp/notarize-app.zip
          ./packaging/macos/notarize.sh /tmp/notarize-app.zip
          xcrun stapler staple dist/Ticker.app
          xcrun stapler validate dist/Ticker.app
      - name: Package macOS app
        if: matrix.platform == 'macos'
        run: |
          ditto -c -k --keepParent dist/Ticker.app dist/Ticker.zip
          python build.py --dmg-only --version "$TICKER_VERSION"
      - name: Sign, notarize, and staple macOS disk image
        if: matrix.platform == 'macos' && env.MACOS_SIGNING_AVAILABLE == 'true'
        env:
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.MACOS_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.MACOS_APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          set -euo pipefail
          DMG="dist/Ticker-${TICKER_VERSION}-macos-arm64.dmg"
          codesign --force --timestamp --sign "$IDENTITY" "$DMG"
          ./packaging/macos/notarize.sh "$DMG"
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Package Linux folder
        if: matrix.platform == 'linux'
        run: tar -C dist -czf dist/Ticker.tar.gz Ticker
      - name: Install verified appimagetool 1.9.1
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          URL="https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage"
          curl --fail --location --silent --show-error "$URL" --output "$RUNNER_TEMP/appimagetool"
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $RUNNER_TEMP/appimagetool" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
      - name: Build Linux AppImage
        if: matrix.platform == 'linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: python build.py --appimage-only --version "$TICKER_VERSION"

      - name: Stage signed release files
        if: (matrix.platform == 'windows' && env.WINDOWS_SIGNING_AVAILABLE == 'true') || (matrix.platform == 'macos' && env.MACOS_SIGNING_AVAILABLE == 'true')
        run: python build.py --stage-release "${{ matrix.platform }}" --version "${{ needs.resolve.outputs.version }}" --commit "${{ needs.resolve.outputs.commit }}" --signed
      - name: Stage unsigned release files
        if: matrix.platform == 'linux' || (matrix.platform == 'windows' && env.WINDOWS_SIGNING_AVAILABLE != 'true') || (matrix.platform == 'macos' && env.MACOS_SIGNING_AVAILABLE != 'true')
        run: python build.py --stage-release "${{ matrix.platform }}" --version "${{ needs.resolve.outputs.version }}" --commit "${{ needs.resolve.outputs.commit }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.platform }}
          path: dist/release-${{ matrix.platform }}/*
          if-no-files-found: error

  publish:
    needs: [resolve, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
      SIGN_RELEASES: ${{ vars.SIGN_RELEASES == 'true' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify the complete set and publish atomically
        run: python release.py
