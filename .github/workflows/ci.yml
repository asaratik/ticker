name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact: Ticker-windows-x86_64
            path: dist/Ticker
          - os: macos-14
            artifact: Ticker-macos-arm64
            path: dist/Ticker.zip
          - os: ubuntu-22.04
            artifact: Ticker-linux-x86_64
            path: dist/Ticker
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.12"
      - name: Build, test, and smoke-test packaged app
        run: python build.py --version 0.0.0-ci --commit "${{ github.sha }}"
      - name: Preserve the macOS bundle in an archive
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/Ticker.app dist/Ticker.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
