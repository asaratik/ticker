name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact: Ticker-windows-x86_64
            path: dist/Ticker
          - os: macos-14
            artifact: Ticker-macos-arm64
            path: dist/Ticker.zip
          - os: ubuntu-22.04
            artifact: Ticker-linux-x86_64
            path: dist/Ticker
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.12"
      - name: Install native Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0
      - name: Build, test, and smoke-test packaged app
        run: python build.py --version 0.0.0-ci --commit "${{ github.sha }}"
      - name: Preserve the macOS bundle in an archive
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/Ticker.app dist/Ticker.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
