name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact: Ticker-windows-x86_64
            path: dist/Ticker
          - os: macos-14
            artifact: Ticker-macos-arm64
            path: dist/Ticker.zip
          - os: ubuntu-22.04
            artifact: Ticker-linux-x86_64
            path: dist/Ticker
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.12"
      - name: Build, test, and smoke-test packaged app
        run: python build.py --version 0.0.0-ci --commit "${{ github.sha }}"
      - name: Preserve the macOS bundle in an archive
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/Ticker.app dist/Ticker.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
