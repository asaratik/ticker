[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ticker"
version = "0.2.0"
description = "Your health data in one local SQLite file, served to AI agents over MCP"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["mcp", "heart-rate", "bluetooth", "ble", "hrv", "oura", "fitbit",
            "apple-health", "quantified-self"]
classifiers = [
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

# bleak is needed only for the BLE source; the HTTP source and every pull
# source work without it. It stays a hard dependency because the default
# HRM_SOURCE is 'ble' and a default that needs an extra install is a bad
# default.
dependencies = [
    "bleak>=3.0.2",
    "tzdata>=2024.1; sys_platform == 'win32'",
    "keyring>=24.0",
    "garminconnect>=0.2.38",
    "curl_cffi>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pyinstaller>=6.0", "pyflakes>=3.0"]

[project.urls]
Homepage = "https://github.com/ashokaratikatla/ticker"
Issues = "https://github.com/ashokaratikatla/ticker/issues"

# One command. `ticker` starts the app; `ticker mcp` is what an agent
# launches; the rest are subcommands of the same thing (see ticker/app/main.py).
[project.scripts]
ticker = "ticker.app.main:main"

# The same app from a launcher with no terminal behind it -- a Start menu or
# login item. gui-scripts, so Windows opens no console window for it.
[project.gui-scripts]
ticker-app = "ticker.app.main:gui_main"

[tool.setuptools]
# The v1 modules are still top-level while they migrate into the package,
# so both shapes have to be declared.
packages = [
    "ticker",
    "ticker.agent",
    "ticker.api",
    "ticker.app",
    "ticker.auth",
    "ticker.db",
    "ticker.ingest",
    "ticker.mcp",
    "ticker.sources",
]
py-modules = [
    "config",
    "hr_source",
    "ble_source",
    "http_source",
    "storage",
]

[tool.setuptools.package-data]
# Read off disk at runtime, so they have to be installed alongside the code.
"ticker.db" = ["schema.sql", "migrations/*.sql"]
"ticker.app" = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
